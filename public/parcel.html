<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบริหารจัดการพัสดุ - KBS PARCEL MANAGEMENT</title>

  <!-- 1. Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- 2. Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- 3. Custom CSS หลักของระบบ -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

<!-- ============================================================================
     📦 MODULE: การบริหารพัสดุ (KBS PARCEL MANAGEMENT)
============================================================================ -->
<div id="kbsparcelmanage" class="form-container container py-3">
  
  <!-- Header Bar & ปุ่มย้อนกลับ -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div class="btn-back" style="cursor: pointer;" onclick="resetFormToMain()">
      <i class="bi bi-arrow-left"></i>
      <span>กลับหน้าหลัก Dashboard</span>
    </div>
    <h4 class="fw-bold text-navy m-0"><i class="bi bi-box-seam-fill me-2 text-warning"></i>ระบบบริหารจัดการพัสดุ</h4>
    <div></div>
  </div>

  <!-- Search & Filter Card -->
  <div class="card card-section p-3 mb-3">
    <div class="row g-2 align-items-end">
      <div class="col-md-3">
        <label class="form-label fw-bold">ค้นหาด้วยเลข นผ.2</label>
        <div class="input-group">
          <input type="text" id="parcelSearchLogNo" class="form-control" placeholder="เช่น นผ205690049" onkeypress="if(event.key==='Enter') loadParcelDataFromLogPay()">
          <button class="btn btn-navy" type="button" onclick="loadParcelDataFromLogPay()">
            <i class="bi bi-search"></i> ค้นหา
          </button>
        </div>
      </div>
      <div class="col-md-3">
        <label class="form-label fw-bold">ฝ่าย</label>
        <select id="parcelFilterDivision" class="form-select" onchange="filterParcelTable()">
          <option value="">-- ทุกฝ่าย --</option>
          <option value="บริหารทั่วไป">บริหารทั่วไป</option>
          <option value="วิชาการ">วิชาการ</option>
          <option value="บุคคล">บุคคล</option>
          <option value="งบประมาณ">งบประมาณ</option>
          <option value="กิจการนักเรียน">กิจการนักเรียน</option>
        </select>
      </div>

      <!-- 🎯 เพิ่ม Dropdown ปีงบประมาณ ต่อจากกรองตามฝ่าย -->
    <div class="col-md-2">
      <label class="form-label fw-bold">ปีงบประมาณ</label>
      <select id="parcelYearBE" class="form-select fw-bold" onchange="loadParcelDataFromLogPay()">
        <option value="2569" selected>2569</option>
        <option value="2570">2570</option>
      </select>
    </div>

      <div class="col-md-3">
        <label class="form-label fw-bold">สถานะ</label>
        <select id="parcelFilterStatus" class="form-select" onchange="loadParcelDataFromLogPay()">
          <option value="pending" selected>รอออกเลขพัสดุ</option>
          <option value="registered">ออกเลขพัสดุแล้ว</option>
          <option value="issued">เบิกจ่ายแล้ว</option>
          <option value="">-- ทุกสถานะ --</option>
        </select>
      </div>
      <div class="col-md-3 text-end">
        <button class="btn btn-outline-secondary" onclick="loadParcelDataFromLogPay(true)">
          <i class="bi bi-arrow-clockwise"></i> รีเฟรชข้อมูล
        </button>
      </div>
    </div>
  </div>

  <!-- Action Bar: ออกเลข & เบิกจ่าย (ปรับเหลือเฉพาะปุ่มสั่งการ) -->
  <div class="card card-section p-3 mb-3 bg-light border-navy">
    <div class="d-flex justify-content-end align-items-center gap-2">
      <button class="btn btn-success fw-bold" onclick="confirmGenerateParcelIDs()">
        <i class="bi bi-barcode me-1"></i> ออกเลขพัสดุที่เลือก (<span id="selectedCountReg">0</span>)
      </button>
      <button class="btn btn-warning fw-bold text-dark" onclick="openIssueModal()">
        <i class="bi bi-box-arrow-right me-1"></i> เบิกจ่ายพัสดุที่เลือก (<span id="selectedCountIssue">0</span>)
      </button>
    </div>
  </div>

  <!-- Parcel Items Table -->
  <div class="card card-section p-0">
    <div class="card-section-header">
      <i class="bi bi-list-check"></i> รายการพัสดุ
    </div>
    <!-- ตำแหน่งแก้ไข: parcel.html ภายในส่วนตาราง <div class="table-responsive"> -->
    <div class="table-responsive">
      <!-- 🎯 เพิ่ม min-width: 1500px ให้ตารางขยายออกด้านข้างและเปิดแถบเลื่อนขวา-ซ้าย -->
      <table class="table table-hover table-bordered align-middle m-0" id="parcelTable" style="min-width: 1500px;">
        <thead class="table-dark text-center" style="background-color: var(--navy-dark, #0f172a);">
          <tr>
            <th style="width: 40px;"><input type="checkbox" id="selectAllParcels" onchange="toggleSelectAllParcels(this)"></th>
            <th style="width: 130px;">นผ.2</th>
            <th style="width: 130px;">ฝ่าย</th>
            <th style="width: 110px;">วันตรวจรับ</th>
            <th style="width: 90px;">ประเภท</th>
            <th style="width: 260px;">รายการ</th>
            <th style="width: 70px;">ชิ้นที่</th>
            <th style="width: 360px;">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <span class="fw-bold"><i class="bi bi-tags-fill me-1"></i>หมวดหมู่</span>
                <!-- 🎯 เพิ่ม Loading Indicator แสดงสถานะการทำงาน -->
                <span id="headerAssetLoadingStatus" class="badge bg-warning text-dark d-none">
                  <span class="spinner-border spinner-border-sm me-1" role="status"></span>กำลังเปลี่ยน...
                </span>
              </div>
              
              <select id="headerMainAsset" class="form-select form-select-sm bg-white text-dark mb-1 shadow-sm" onchange="onHeaderMainAssetChange(this)">
                <option value="">-- เปลี่ยนหมวดหมู่หลักทั้งหมด --</option>
              </select>
              <select id="headerSubcatAsset" class="form-select form-select-sm bg-white text-dark shadow-sm" onchange="onHeaderSubcatAssetChange(this)" disabled>
                <option value="">-- เปลี่ยนหมวดหมู่ย่อยทั้งหมด --</option>
              </select>
            </th>
            <th style="width: 120px;">ราคา/หน่วย</th>
            <th style="width: 80px;">หน่วย</th>
            <th style="width: 180px;">เลขพัสดุ</th>
            <th style="width: 160px;">สถานะ / ผู้รับเบิก</th>
          </tr>
        </thead>
        <tbody id="parcelTableBody">
          <tr>
            <td colspan="12" class="text-center py-4 text-muted">
              กรุณากรอกเลข นผ.2 หรือกดค้นหาเพื่อโหลดรายการพัสดุ
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal เลือกผู้รับเบิกพัสดุ -->
<div class="modal fade" id="issueParcelModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow-lg border-0 rounded-3">
      <div class="modal-header bg-navy text-white" style="background-color: #0f172a;">
        <h5 class="modal-title fw-bold text-white"><i class="bi bi-person-check-fill me-2 text-warning"></i>บันทึกการเบิกจ่ายพัสดุ</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <div class="mb-3">
          <label class="form-label fw-bold">เลือกผู้รับเบิก (จากคณะกรรมการ/ผู้ขอซื้อ)</label>
          <select id="issueRecipientSelect" class="form-select mb-2" onchange="syncRecipientInput(this)">
            <option value="">-- เลือกจากรายชื่อกรรมการ --</option>
          </select>
          <input type="text" id="issueRecipientCustom" class="form-control" placeholder="หรือพิมพ์ชื่อ-นามสกุล ผู้รับเบิก">
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">วันที่เบิกจ่าย</label>
          <input type="date" id="issueDateInput" class="form-control">
        </div>
      </div>
      <div class="modal-footer bg-light">
        <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">ยกเลิก</button>
        <button type="button" class="btn btn-warning fw-bold px-4" onclick="executeIssueParcels()">ยืนยันการเบิกจ่าย</button>
      </div>
    </div>
  </div>
</div>

<!-- SweetAlert2 JS -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- JavaScript Module -->
<script type="module" src="js/parcel.js"></script>
</body>
</html>
