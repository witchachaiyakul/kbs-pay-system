<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ระบบบริหารจัดการกลุ่มงานงบประมาณ</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

    <div class="container" style="max-width: 460px;">
        <!-- Card 1: ปุ่มเข้าสู่ระบบหลัก -->
        <div id="loginCard" class="card shadow-lg border-0 rounded-4 p-4 text-center">
            <div class="mb-3">
                <div class="bg-primary bg-opacity-10 text-primary d-inline-flex align-items-center justify-content-center rounded-circle p-3" style="width: 70px; height: 70px;">
                    <i class="bi bi-shield-lock-fill fs-1"></i>
                </div>
            </div>
            
            <h5 class="fw-bold text-dark mb-1">ระบบบริหารจัดการกลุ่มงานงบประมาณ</h5>
            <p class="text-muted small mb-4">โรงเรียนกาญจนาภิเษกวิทยาลัย กระบี่</p>

            <div id="loadingState" class="d-none my-4">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p id="loadingText" class="text-muted small mt-2">กำลังตรวจสอบสิทธิ์เข้าใช้งาน...</p>
            </div>

            <div id="actionArea">
                <button id="btnLineLogin" class="btn btn-success btn-lg w-100 fw-bold rounded-3 shadow-sm py-2 text-white mb-2" style="background-color: #06C755; border: none;">
                    <i class="bi bi-line me-2"></i> เข้าสู่ระบบด้วย LINE
                </button>
            </div>
        </div>

        <!-- Card 2: เลือกรายชื่อลงทะเบียนครั้งแรก (กรณีไม่พบ line_user_id) -->
        <div id="registerCard" class="card shadow-lg border-0 rounded-4 p-4 text-center d-none">
            <img id="regUserAvatar" src="" class="rounded-circle mx-auto mb-2 border border-2 border-success" style="width: 70px; height: 70px; object-fit: cover;">
            <h6 class="fw-bold mb-1 text-dark" id="regUserName"></h6>
            <p class="text-muted small mb-3">พบการเข้าใช้งานครั้งแรก กรุณาเลือกรายชื่อของคุณเพื่อผูกบัญชี</p>

            <form id="formRegister" class="text-start">
                <div class="mb-3">
                    <label for="selectCommittee" class="form-label small fw-bold">เลือกรายชื่อบุคลากร / กรรมการ:</label>
                    <select id="selectCommittee" class="form-select rounded-3" required>
                        <option value="">-- กรุณาเลือกรายชื่อ --</option>
                    </select>
                </div>
                <button type="submit" id="btnConfirmRegister" class="btn btn-primary w-100 fw-bold rounded-3">
                    <i class="bi bi-check-circle me-1"></i> ยืนยันการลงทะเบียน
                </button>
            </form>
        </div>

        <!-- Card 3: ไม่มีสิทธิ์ / รายชื่อเต็ม -->
        <div id="noAuthCard" class="card shadow-lg border-0 rounded-4 p-4 text-center d-none">
            <h5 class="text-danger fw-bold mb-2">❌ ไม่สามารถเข้าใช้งานระบบได้</h5>
            <p class="text-muted small mb-3">ไม่พบรายชื่อของคุณในระบบ หรือการลงทะเบียนถูกจำกัด</p>
            <button onclick="window.location.href='login.html'" class="btn btn-secondary btn-sm rounded-3">
                <i class="bi bi-arrow-left me-1"></i> กลับหน้าแรก
            </button>
        </div>
    </div>

    <script type="module" src="js/firestore.js"></script>
    <script type="module" src="js/login.js"></script>
</body>
</html>
